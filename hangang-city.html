function driveCar(c,dt,thr,brk,str,hb){
  const fx=Math.sin(c.h),fz=Math.cos(c.h),rx=-fz,rz=fx;
  let vF=c.vx*fx+c.vz*fz,vS=c.vx*rx+c.vz*rz;const sp=Math.abs(vF);

  if(brk){if(vF>.5)vF-=26*dt;else vF=Math.max(-9,vF-7*dt);}
  if(!thr&&!brk)vF-=vF*.12*dt;
  if(hb)vF-=vF*.5*dt;
  if(vF>34)vF=34;
  const grip=hb?1.6:(Math.abs(str)>.5&&sp>18?3.6:9);
  vS*=Math.exp(-grip*dt);
  const rate=2.5*Math.min(1,sp/6)*(1-Math.min(.55,sp/80));

  else{objMesh.visible=false;$('mn').textContent='자유 주행';$('ms').textContent='노란 기둥 위에 서면 임무가 시작됩니다';}
}
function startM(k){MI={k,t:0,st:0};if(k===1){wanted=Math.max(wanted,2);setPol();}toast('임무 시작: '+MISS[k].n);}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;toastT=2.6;}

// ---------- sky / time / lights
const C1=new THREE.Color('#9dcfff'),C2=new THREE.Color('#f58a5c'),C3=new THREE.Color('#070b1c');
function updSky(){
  const e=Math.sin(2*Math.PI*(T-.25));EL=e;
  nightK=clamp((.08-e)/.3,0,1);
  if(e>=0)SKY.lerpColors(C2,C1,clamp(e/.35,0,1));else SKY.lerpColors(C2,C3,clamp(-e/.25,0,1));
  const az=2*Math.PI*T;
  sun.intensity=clamp(e*3.2,0,1)*2.6;moon.intensity=nightK*.35;
  sun.userData.dir=[Math.cos(az)*.7,Math.max(.05,e),Math.sin(az)*.6];
  hemi.intensity=.28+.45*clamp(e*2+.5,0,1);
  bldMat.emissiveIntensity=.05+nightK*1.4;lampMat.emissiveIntensity=nightK*2.5;
  const sk=.75+nightK*1.1;SIGNMAT.forEach(m=>m.color.setScalar(sk));
  const sc=LCOL;
}

// ---------- input
const K={},on=(a,b)=>!!(K[a]||K[b]);let evF=false,evJ=false,started=false,mapOn=true;
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  K[e.code]=true;if(e.repeat)return;
  if(e.code==='KeyF')evF=true;if(e.code==='Space')evJ=true;
  if(e.code==='KeyM'){mapOn=!mapOn;$('map').style.display=mapOn?'block':'none';}
});
addEventListener('keyup',e=>{K[e.code]=false;});
$('start').addEventListener('click',()=>{$('start').style.display='none';started=true;});
const cv=$('c');
cv.addEventListener('pointerdown',()=>dragging=true);
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{if(dragging){camYaw-=e.movementX*.006;camPitch=clamp(camPitch+e.movementY*.004,.08,1.1);dragT=0;}});
cv.addEventListener('wheel',e=>{camDist=clamp(camDist+e.deltaY*.01,4,16);},{passive:true});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});

// ---------- camera (sphere-cast against boxes to avoid clipping)
function inside(x,y,z){for(const b of nearBoxes(x,z))if(x>=b.x0&&x<=b.x1&&z>=b.z0&&z<=b.z1&&y<b.top&&y>0)return true;return false;}
function updCam(dt){
  const inC=!!PC,tx=P.x,ty=P.y+(inC?1.8:1.5),tz=P.z;
  if(inC&&dragT>1.2)camYaw+=angD(camYaw,PC.h+Math.PI)*Math.min(1,dt*2.5);
  const want=inC?camDist+1.2:camDist-1.5;
  const dx=Math.sin(camYaw)*Math.cos(camPitch),dy=Math.sin(camPitch),dz=Math.cos(camYaw)*Math.cos(camPitch);
  let dist=want;
  for(let t=1;t<=want;t+=.7)if(inside(tx+dx*t,ty+dy*t,tz+dz*t)){dist=Math.max(1.2,t-.7);break;}
  camD+=(dist-camD)*Math.min(1,dt*10);
  cam.position.set(tx+dx*camD,Math.max(.6,ty+dy*camD),tz+dz*camD);cam.lookAt(tx,ty,tz);
}

// ---------- minimap (static background + per-frame dots)
const BG=document.createElement('canvas');BG.width=BG.height=700;
{const g=BG.getContext('2d');g.fillStyle='#262b35';g.fillRect(0,0,700,700);
 g.fillStyle='#6b7280';for(const b of BL){}
 for(let c=0;c<12;c++)for(let r=0;r<12;r++){let x0=XB[c]+6,x1=XB[c+1]-6,z0=XB[r]+6,z1=XB[r+1]-6;if(r===5)z1=-RIV;if(r===6)z0=RIV;g.fillStyle='#8a909a';g.fillRect(x0+350,z0+350,x1-x0,z1-z0);}
 g.fillStyle='#1f5f7a';g.fillRect(0+350-400,-RIV+350,800,2*RIV);
 g.fillStyle='#b9c0ca';for(const bx of BRX)g.fillRect(bx-6+350,-13+350,12,26);
 g.fillStyle='#d0d5dd';g.fillRect(-300+350,164+350,600,14);}
const MC=$('map').getContext('2d');
function drawMap(){
  MC.fillStyle='#0a0d14';MC.fillRect(0,0,200,200);
  MC.drawImage(BG,P.x+350-120,P.z+350-120,240,240,0,0,200,200);
  const s=200/240,mx=x=>(x-P.x)*s+100,mz=z=>(z-P.z)*s+100;
  MC.fillStyle='#aab3c0';for(const o of CARS)if(Math.hypot(o.x-P.x,o.z-P.z)<120)MC.fillRect(mx(o.x)-1.5,mz(o.z)-1.5,3,3);
  MC.fillStyle='#ff5a5a';for(const o of POL)if(o.on)MC.fillRect(mx(o.x)-2.5,mz(o.z)-2.5,5,5);
  if(MI){const tg=MI.k===0?(MI.st?MISS[0].dst:MISS[0].st):MI.k===1?MISS[1].st:(CPS[MI.st]?[CPS[MI.st].x,CPS[MI.st].z]:null);
    if(tg){MC.fillStyle='#ffd23f';MC.beginPath();MC.arc(mx(tg[0]),mz(tg[1]),4,0,7);MC.fill();}}
  MC.save();MC.translate(100,100);MC.rotate(-(PC?PC.h:P.h));MC.fillStyle='#4ee6ff';
  MC.beginPath();MC.moveTo(0,-7);MC.lineTo(5,6);MC.lineTo(-5,6);MC.closePath();MC.fill();MC.restore();
}

// ---------- main loop
function step(dt){
  T=(T+dt/DAYLEN)%1;TS+=dt;
  if(evF){evF=false;toggleCar();}
  const fw=on('KeyW','ArrowUp'),bk=on('KeyS','ArrowDown'),lf=on('KeyA','ArrowLeft'),rt=on('KeyD','ArrowRight');
  if(PC)updCar(dt,fw,bk,lf,rt,!!K.Space);else updFoot(dt,fw,bk,lf,rt);
  evJ=false;
  av.visible=!PC;
  // crimes & wanted decay
  crimeCD=Math.max(0,crimeCD-dt);dragT+=dt;
  const nearPol=POL.some(o=>o.on&&Math.hypot(o.x-P.x,o.z-P.z)<75);
  if(wanted>0){if(nearPol)hideT=0;else hideT+=dt;if(hideT>8){wanted--;hideT=0;setPol();toast('수배 하락 · '+wanted);}}
  for(const o of POL)if(o.on&&Math.hypot(o.x-P.x,o.z-P.z)>330)placePol(o);
  // traffic
  for(const o of CARS)updAI(o,dt);
  for(const o of POL)if(o.on)updAI(o,dt);else o.g.visible=false;
  const key=lightOf('x',TS)+lightOf('z',TS);
  if(key!==step.key){step.key=key;for(let k=0;k<LN.length;k++){TLH.setColorAt(2*k,LCOL[lightOf('x',TS)]);TLH.setColorAt(2*k+1,LCOL[lightOf('z',TS)]);}TLH.instanceColor.needsUpdate=true;}
  // pedestrians (cull far ones)
  for(let k=0;k<NPED;k++){const p=PEDS[k];updPed(p,dt);const far=Math.hypot(p.x-P.x,p.z-P.z)>170;setI(PM,k,p.x,0,p.z,0,far?0.0001:1);}
  PM.instanceMatrix.needsUpdate=true;
  // LOD / culling
  for(const b of BL){const d=Math.hypot(b.cx-P.x,b.cz-P.z);b.m.visible=d<CULL;b.det.visible=d<170;}
  updMission(dt);
  // sun follows player
  const sd2=sun.userData.dir||[0,1,0];
  sun.position.set(P.x+sd2[0]*260,sd2[1]*260+10,P.z+sd2[2]*260);sun.target.position.set(P.x,0,P.z);sun.target.updateMatrixWorld();
  moon.position.set(P.x-sd2[0]*260,200,P.z-sd2[2]*260);moon.target.position.set(P.x,0,P.z);
  updCam(dt);
  // HUD
  const hh=Math.floor(T*24)%24,mm=Math.floor((T*24-Math.floor(T*24))*60);
  $('clock').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+' · '+(EL>.3?'낮':EL>0?'노을':'밤');
  $('wan').textContent='수배 '+'★'.repeat(wanted)+'☆'.repeat(3-wanted);
  $('cash').textContent='₩ '+cash.toLocaleString('ko-KR');
  $('sv').textContent=Math.round(P.sp*3.6);
  $('gear').textContent=PC?(PC.drift?'DRIFT · 차량':'차량'):'도보';
  const n=PC?null:nearestEnterable(),pr=$('prompt');
  if(PC&&Math.hypot(PC.vx,PC.vz)<6){pr.style.display='block';pr.textContent='F 하차';}
  else if(!PC&&n){pr.style.display='block';pr.textContent='F 탑승';}
  else pr.style.display='none';
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0;}
  drawMap();
}
let last=performance.now();
renderer.setAnimationLoop(now=>{
  const dt=Math.min(.05,(now-last)/1000);last=now;
  updSky();
  if(started)step(dt);
  else{ // idle: keep the world and camera alive
    T=(T+dt/DAYLEN)%1;TS+=dt;for(const b of BL){const d=Math.hypot(b.cx-P.x,b.cz-P.z);b.m.visible=d<CULL;b.det.visible=d<170;}
    updCam(dt);
  }
  renderer.render(scene,cam);
});
</script></body></html>
